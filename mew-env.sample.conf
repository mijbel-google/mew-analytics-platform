# =============================================================================
# Ministry of Electricity & Water (MEW) - Energy Intelligence Platform
# Sample Deployment Configuration File (`mew-env.sample.conf`)
# Usage: ./deploy_mew_solution.sh --config mew-env.sample.conf
# =============================================================================

# Mandatory Non-Production Acknowledgement ("true" required for unattended mode)
ACCEPT_NON_PROD_DISCLAIMER="true"

# GCP Project & Region
GCP_PROJECT_ID="electric-load-demo"
GCP_LOCATION="europe-west4"

# Unified BigQuery Dataset (All Bronze, Silver, Gold, Dimensions & ML Models reside here)
DATASET_NAME="mew_analytics"

# Existing Customer Raw / Bronze Tables in the Unified Dataset
RAW_POWER_STAT_TABLE="POWER_STAT"
RAW_GENERATOR_TABLE="GENERATOR_READINGS"

# Dataform & Pub/Sub Settings
DATAFORM_REPO="mew-grid-pipeline"
PUBSUB_TOPIC="grid-stress-alerts"
SERVICE_ACCOUNT_NAME="mew-pipeline-sa"

# Managed Airflow (Cloud Composer) Deployment Settings
DEPLOY_COMPOSER="true"
PROVISION_NEW_COMPOSER_ENV="false"
COMPOSER_ENV_NAME="mew-airflow-env"

# Cloud Run Data App Deployment Settings
DEPLOY_DATA_APP="true"
SERVICE_NAME="mew-scada-intelligence-hub"
REPO_NAME="mew-data-apps"
